[project]
name = "ai-updates"
version = "0.1.0"
description = "Personal AI news, model prices and benchmarks portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[tool.uv]
package = false
