# Feeds for the AI portal.
# Each [[feed]] has: name, url, category, optional filter = true (keep only
# entries whose title+summary match a keyword below), optional limit (max
# entries taken per refresh, default 25), optional enabled = false.
# All URLs were verified live on 2026-11-13 (Regulation feeds on 2026-11-23).

# Keywords for filter = true feeds (case-insensitive, whole-word match).
keywords = [
  "AI", "A.I.", "artificial intelligence", "machine learning", "deep learning",
  "LLM", "LLMs", "large language model", "language model", "language models",
  "neural network", "generative", "GenAI", "chatbot", "chatbots",
  "GPT", "ChatGPT", "OpenAI", "Anthropic", "Claude", "Gemini", "DeepMind",
  "Llama", "Mistral", "DeepSeek", "Qwen", "Copilot", "transformer", "transformers",
  "agent", "agents", "agentic", "inference", "AGI", "diffusion", "multimodal",
  "reasoning model", "foundation model", "fine-tuning", "RAG", "embedding", "embeddings",
  "AI Act",
  # French, for the CNIL and ANSSI feeds
  "IA", "intelligence artificielle", "IA générative", "apprentissage automatique",
  "algorithme", "algorithmes", "modèle de langage", "modèles de langage",
]

