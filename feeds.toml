# ---------------------------------------------------------------- Regulation
# Verified 2026-11-23. CNIL and CERT-FR publish in French and cover far more
# than AI, so they are keyword-filtered (French keywords are in the list above).

[[feed]]
name = "CNIL"
# www.cnil.fr/en/rss.xml serves the same French items
url = "https://www.cnil.fr/fr/rss.xml"
category = "Regulation"
filter = true

[[feed]]
name = "EU AI Act"
# artificialintelligenceact.eu (Future of Life Institute): explainers and news on the AI Act
url = "https://artificialintelligenceact.eu/feed/"
category = "Regulation"

[[feed]]
name = "European Commission"
# Shaping Europe's digital future (DG CONNECT): AI Act implementation, AI Office, calls
url = "https://digital-strategy.ec.europa.eu/en/rss.xml"
category = "Regulation"
filter = true

[[feed]]
name = "ANSSI (CERT-FR)"
# cyber.gouv.fr has no feed and blocks feed readers; CERT-FR is ANSSI's CERT.
url = "https://cert.cyber.gouv.fr/actualite/feed/"
category = "Regulation"
filter = true

[[feed]]
name = "ANSSI threat reports"
url = "https://cert.cyber.gouv.fr/cti/feed/"
category = "Regulation"
filter = true

# ---------------------------------------------------------------- Community
[[feed]]
name = "Hacker News"
# hnrss.org is sometimes slow or answers 502; the collector retries twice and the
# next refresh catches up. (&count=50 made it slower, so the default 20 is used.)
url = "https://hnrss.org/newest?q=AI+OR+LLM+OR+GPT&points=100"
category = "Community"

[[feed]]
name = "r/LocalLLaMA"
# Reddit answers 403/429 to logged-out RSS requests from many networks
# (verified 2026-11-13, also via old.reddit.com and openrss.org).
# Set enabled = true to try it from your network.
url = "https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day"
category = "Community"
enabled = false
